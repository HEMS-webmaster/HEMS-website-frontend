name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/996590178042/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'firebase-github-deploy@hems-workshop.iam.gserviceaccount.com'
          token_format: 'access_token'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'
          
      - name: Install Dependencies
        working-directory: src/frontend
        run: npm ci
        
      - name: Build Static Export
        working-directory: src/frontend
        run: npm run build
        
      - name: Deploy to Firebase Hosting
        working-directory: src/frontend
        run: npx firebase-tools deploy --project hems-workshop --only hosting --non-interactive
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
